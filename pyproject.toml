[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "moro"
version = "0.4.0.dev0"

description = "Python library for kinematic and dynamic modeling of robots"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    { name = "Pedro Jorge De Los Santos", email = "delossantosmfq@gmail.com" }
]

keywords = [
    "robotics",
    "kinematics",
    "dynamics",
]

dependencies = [
    "sympy",
    "matplotlib",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
]


[project.urls]
Homepage = "https://github.com/JorgeDeLosSantos/moro"
Repository = "https://github.com/JorgeDeLosSantos/moro"
Issues = "https://github.com/JorgeDeLosSantos/moro/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["moro*"]


[tool.setuptools.package-data]
moro = [
    "templates/**/*",
]