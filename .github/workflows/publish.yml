name: Publish to PyPI

# Creating a tag alone does not publish anything. A maintainer must
# explicitly publish a stable GitHub Release using that tag.
on:
  release:
    types: [published]

permissions:
  contents: read

# Never cancel an in-flight upload of the same version.
concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Expected an unprefixed stable version tag, got {tag!r}")

          with Path("pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)["project"]
          version = project["version"]
          if project["name"] != "moro" or version != tag:
              raise SystemExit(
                  f"Tag {tag!r} must match moro's pyproject version {version!r}"
              )

          module = ast.parse(Path("moro/version.py").read_text(encoding="utf-8"))
          assignments = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              )
          ]
          if assignments != [version]:
              raise SystemExit("moro/version.py is not synchronized with pyproject.toml")
          print(f"Validated Moro {version} release metadata")
          PY

      - name: Verify tagged commit is part of master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD origin/master || {
            echo "The release tag must point to a commit in master's history." >&2
            exit 1
          }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: moro-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/moro/

    # Only this job can request PyPI's short-lived OIDC credential.
    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: moro-distributions
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
