name: Tests

on:
  push:
    branches:
      - master
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest -q

  package-smoke:
    name: Build and install distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/moro-package-smoke
          /tmp/moro-package-smoke/bin/python -m pip install --upgrade pip
          /tmp/moro-package-smoke/bin/python -m pip install dist/*.whl

      - name: Install sdist in a clean virtual environment
        run: |
          python -m venv /tmp/moro-sdist-smoke
          /tmp/moro-sdist-smoke/bin/python -m pip install --upgrade pip
          /tmp/moro-sdist-smoke/bin/python -m pip install dist/*.tar.gz

      - name: Smoke test installed sdist
        working-directory: /tmp
        run: |
          /tmp/moro-sdist-smoke/bin/python - <<'PY'
          import moro
          from pathlib import Path
          from importlib.metadata import version
          from importlib.resources import files
          from IPython.display import HTML
          from sympy import Symbol
          from moro.visualization import RobotVisualizer

          assert moro.__version__ == version("moro")
          assert "site-packages" in Path(moro.__file__).parts, moro.__file__
          resources = files("moro.visualization.templates")
          for name in (
              "threejs_viewer.html", "threejs_animation.html",
              "threejs_workspace.html", "threejs_common.js",
          ):
              assert resources.joinpath(name).is_file()

          q = Symbol("q")
          viz = RobotVisualizer(moro.Robot((0.5, 0, 0, q, "r")))
          assert isinstance(viz.plot({q: 0.2}), HTML)
          assert isinstance(viz.animate([{q: 0.0}, {q: 0.3}]), HTML)
          from moro.workspace import sample_workspace, section_workspace
          from moro.visualization import plot_workspace, plot_workspace_section
          from moro.trajectory import joint_waypoint_trajectory
          robot = moro.Robot((0.5, 0, 0, q, "r"))
          robot.joint_limits = [(0.0, 1.0)]
          workspace = sample_workspace(robot, method="grid", grid_shape=(5,))
          section = section_workspace(workspace, plane="xy", level=0, thickness=0)
          assert isinstance(plot_workspace(workspace), HTML)
          assert isinstance(plot_workspace_section(section), HTML)
          motion = joint_waypoint_trajectory([0.0, 0.5, 1.0], [0, 1, 2], samples_per_segment=3)
          assert motion.q.shape == (5, 1)
          assert isinstance(viz.animate(motion.q, times=motion.t), HTML)
          print(f"Moro {moro.__version__} installed-sdist smoke test passed.")
          PY

      - name: Smoke test installed package
        # Running from the checkout would let the source tree shadow the
        # installed wheel on sys.path. Use a directory outside the repo.
        working-directory: /tmp
        run: |
          /tmp/moro-package-smoke/bin/python - <<'PY'
          import moro
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path
          from IPython.display import HTML
          from sympy import Symbol
          from moro.differential_kinematics import solve_velocity_ik
          from moro.inverse_kinematics import solve_pose_ik
          from moro.trajectory import joint_trajectory
          from moro.dynamics import simulate
          from moro.workspace import sample_workspace
          from moro.visualization import RobotVisualizer, plot_workspace

          # Version consistency, without hard-coding the previous release.
          assert moro.__version__ == version("moro")
          assert "site-packages" in Path(moro.__file__).parts, moro.__file__

          resources = files("moro.visualization.templates")
          for template_name in (
              "threejs_viewer.html", "threejs_animation.html",
              "threejs_workspace.html", "threejs_common.js",
          ):
              assert resources.joinpath(template_name).is_file()

          # Exercise both default render paths from the installed wheel,
          # not from the editable checkout used by the test matrix.
          q = Symbol("q")
          robot = moro.Robot((0.5, 0, 0, q, "r"))
          viz = RobotVisualizer(robot)
          plot = viz.plot({q: 0.2})
          animation = viz.animate([{q: 0.0}, {q: 0.3}], interval=50)
          assert isinstance(plot, HTML)
          assert isinstance(animation, HTML)
          assert '"joint_representation": "kinematic"' in plot.data
          assert '"joint_solids"' in plot.data
          assert '"interval": 50.0' in animation.data
          assert '"joint_solids"' in animation.data
          from moro.trajectory import joint_waypoint_trajectory
          from moro.workspace import section_workspace
          from moro.visualization import plot_workspace_section
          robot.joint_limits = [(0.0, 1.0)]
          workspace = sample_workspace(robot, method="grid", grid_shape=(5,))
          section = section_workspace(workspace, plane="xy", level=0, thickness=0)
          assert isinstance(plot_workspace(workspace, show_grid=True), HTML)
          assert isinstance(plot_workspace_section(section, show_grid=True), HTML)
          motion = joint_waypoint_trajectory([0.0, 0.5, 1.0], [0, 1, 2], samples_per_segment=3)
          assert motion.q.shape == (5, 1)
          assert isinstance(viz.animate(motion.q, times=motion.t), HTML)
          print(f"Moro {moro.__version__} installed-wheel smoke test passed.")
          PY
