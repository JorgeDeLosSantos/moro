<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        #controls-__UNIQUE_ID__ {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #controls-__UNIQUE_ID__ .control-row {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        #controls-__UNIQUE_ID__ button,
        #controls-__UNIQUE_ID__ select {
            margin: 0;
            padding: 5px 9px;
            cursor: pointer;
            border: none;
            color: white;
            background: #4CAF50;
            border-radius: 3px;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        #controls-__UNIQUE_ID__ button:hover,
        #controls-__UNIQUE_ID__ select:hover {
            background: #449d48;
        }

        #status-__UNIQUE_ID__ {
            margin-top: 5px;
            padding: 5px;
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="controls-__UNIQUE_ID__">
        <div class="control-row">
            <button onclick="window.robot___UNIQUE_ID__.setView('front')">
                Front
            </button>

            <button onclick="window.robot___UNIQUE_ID__.setView('top')">
                Top
            </button>

            <button onclick="window.robot___UNIQUE_ID__.setView('isometric')">
                Isometric
            </button>
        </div>

        <div class="control-row">
            <select
                id="cam-type-__UNIQUE_ID__"
                onchange="window.robot___UNIQUE_ID__.setCameraType(this.value)"
            >
                <option value="perspective">Perspective</option>
                <option value="orthographic" selected>Orthographic</option>
            </select>

            <button onclick="window.robot___UNIQUE_ID__.resetView()">
                &#x21bb; Reset View
            </button>
        </div>

        <div id="status-__UNIQUE_ID__">Loading...</div>
    </div>

    <div id="container-__UNIQUE_ID__"></div>

    <script>
    (function() {
        if (
            typeof THREE !== 'undefined' &&
            typeof THREE.OrbitControls !== 'undefined'
        ) {
            initRobot___UNIQUE_ID__();
            return;
        }

        loadScript(
            'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
            function() {
                loadScript(
                    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js',
                    initRobot___UNIQUE_ID__
                );
            }
        );

        function loadScript(src, onLoad) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = onLoad;
            script.onerror = function() {
                var status = document.getElementById('status-__UNIQUE_ID__');
                status.innerHTML = 'Error loading Three.js';
                status.style.color = 'red';
            };
            document.head.appendChild(script);
        }

        function initRobot___UNIQUE_ID__() {
            var data = __ROBOT_DATA__;
            var style = data.style;
            var container = document.getElementById('container-__UNIQUE_ID__');

            var scene;
            var camera;
            var perspectiveCamera;
            var orthographicCamera;
            var renderer;
            var controls;
            var robotGroup;

            var activeCameraType = 'orthographic';
            var currentView = 'isometric';

            var width = __WIDTH__;
            var height = __HEIGHT__;
            var aspect = width / height;
            var sceneScale = Math.max(Number(data.dimension) || 0, 1);
            var resolvedStyle = {
                frameScale: style.frame_scale !== null
                    ? Number(style.frame_scale)
                    : Math.max(sceneScale / 6, 1.0),
                jointRadius: style.joint_size !== null
                    ? Number(style.joint_size)
                    : Math.max(sceneScale * 0.02, 0.4),
                baseRadius: style.base_size !== null
                    ? Number(style.base_size)
                    : Math.max(sceneScale * 0.03, 0.6),
                linkRadius: Math.max(sceneScale * 0.015, 0.3)
                    * (Number(style.link_linewidth) / 3)
            };

            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf5f5f5);

                var nearPlane = Math.max(sceneScale * 0.001, 0.01);
                var farPlane = Math.max(sceneScale * 50, 1000);

                perspectiveCamera = new THREE.PerspectiveCamera(
                    50,
                    aspect,
                    nearPlane,
                    farPlane
                );

                var orthoHeight = sceneScale * 3.0;
                var orthoWidth = orthoHeight * aspect;

                orthographicCamera = new THREE.OrthographicCamera(
                    -orthoWidth / 2,
                    orthoWidth / 2,
                    orthoHeight / 2,
                    -orthoHeight / 2,
                    nearPlane,
                    farPlane
                );

                // Robotics convention: Z is the vertical axis.
                perspectiveCamera.up.set(0, 0, 1);
                orthographicCamera.up.set(0, 0, 1);

                camera = orthographicCamera;

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.target.copy(getDefaultTarget());
                controls.enableDamping = true;
                controls.dampingFactor = 0.1;
                controls.mouseButtons = {
                    LEFT: THREE.MOUSE.PAN,
                    MIDDLE: THREE.MOUSE.ROTATE,
                    RIGHT: THREE.MOUSE.PAN
                };
                controls.touches = {
                    ONE: THREE.TOUCH.PAN,
                    TWO: THREE.TOUCH.DOLLY_PAN
                };

                controls.addEventListener('start', function() {
                    currentView = 'custom';
                    updateStatus();
                });

                // Lights
                scene.add(new THREE.AmbientLight(0xffffff, 0.6));

                var dl1 = new THREE.DirectionalLight(0xffffff, 0.5);
                dl1.position.set(sceneScale, sceneScale, sceneScale);
                scene.add(dl1);

                var dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
                dl2.position.set(-sceneScale, -sceneScale, -sceneScale);
                scene.add(dl2);

                // Grid on the XY plane for the Z-up convention.
                if (style.show_grid) {
                    var gridSize = sceneScale * 2.5;
                    var grid = new THREE.GridHelper(
                        gridSize,
                        20,
                        0x888888,
                        0xcccccc
                    );
                    grid.rotation.x = Math.PI / 2;
                    scene.add(grid);
                }

                scene.add(new THREE.AxesHelper(sceneScale / 4));

                robotGroup = new THREE.Group();
                scene.add(robotGroup);

                drawRobot(data);
                setView('isometric', true);
                animate();
            } catch (e) {
                var status = document.getElementById('status-__UNIQUE_ID__');
                status.innerHTML = 'Error: ' + e.message;
                status.style.color = 'red';
            }

            function getDefaultTarget() {
                return new THREE.Vector3(
                    0,
                    0,
                    sceneScale / 3
                );
            }

            function drawRobot(d) {
                var joints = d.joints;
                var frames = d.frames;

                // Links
                if (style.show_links) {
                    var linkMat = new THREE.MeshPhongMaterial({
                        color: style.link_color,
                        shininess: 30,
                        side: THREE.DoubleSide
                    });

                    for (var i = 0; i < joints.length - 1; i++) {
                        var start = new THREE.Vector3().fromArray(joints[i]);
                        var end = new THREE.Vector3().fromArray(joints[i + 1]);
                        var dir = new THREE.Vector3().subVectors(end, start);
                        var len = dir.length();

                        if (len < 1e-6) {
                            continue;
                        }

                        var cylinder = new THREE.Mesh(
                            new THREE.CylinderGeometry(
                                resolvedStyle.linkRadius,
                                resolvedStyle.linkRadius,
                                len,
                                8
                            ),
                            linkMat
                        );

                        var midpoint = start.clone().add(
                            dir.clone().multiplyScalar(0.5)
                        );

                        cylinder.position.copy(midpoint);
                        cylinder.quaternion.setFromUnitVectors(
                            new THREE.Vector3(0, 1, 0),
                            dir.clone().normalize()
                        );

                        robotGroup.add(cylinder);
                    }
                }

                // Joints
                if (style.show_joints) {
                    var jointMat = new THREE.MeshPhongMaterial({
                        color: style.joint_color,
                        shininess: 50
                    });

                    var baseMat = new THREE.MeshPhongMaterial({
                        color: style.base_color,
                        shininess: 50
                    });

                    joints.forEach(function(position, index) {
                        if (index === 0 && !style.show_base) {
                            return;
                        }

                        var radius = index === 0
                            ? resolvedStyle.baseRadius
                            : resolvedStyle.jointRadius;

                        var material = index === 0 ? baseMat : jointMat;
                        var sphere = new THREE.Mesh(
                            new THREE.SphereGeometry(radius, 16, 16),
                            material
                        );

                        sphere.position.fromArray(position);
                        robotGroup.add(sphere);
                    });
                }

                // Frames
                if (style.show_frames) {
                    frames.forEach(function(frame) {
                        var origin = new THREE.Vector3().fromArray(frame.position);
                        var xAxis = new THREE.Vector3().fromArray(frame.x);
                        var yAxis = new THREE.Vector3().fromArray(frame.y);
                        var zAxis = new THREE.Vector3().fromArray(frame.z);

                        /*
                         * FrameData stores the local axes as the columns of the
                         * rotation matrix R = [x y z]. Matrix4.set receives its
                         * values row by row, so the components must be arranged
                         * accordingly.
                         */
                        var rotationMatrix = new THREE.Matrix4();
                        rotationMatrix.set(
                            xAxis.x, yAxis.x, zAxis.x, 0,
                            xAxis.y, yAxis.y, zAxis.y, 0,
                            xAxis.z, yAxis.z, zAxis.z, 0,
                            0,       0,       0,       1
                        );

                        var axes = new THREE.AxesHelper(
                            resolvedStyle.frameScale
                        );
                        axes.position.copy(origin);
                        axes.setRotationFromMatrix(rotationMatrix);
                        robotGroup.add(axes);
                    });
                }
            }

            function setView(viewName, resetTarget) {
                var distance = sceneScale * 2.5;

                if (resetTarget !== false) {
                    controls.target.copy(getDefaultTarget());
                }

                var target = controls.target.clone();
                var position = new THREE.Vector3();

                switch (viewName) {
                    case 'front':
                        // Camera on the negative-Y side, looking toward +Y.
                        camera.up.set(0, 0, 1);
                        position.set(
                            target.x,
                            target.y - distance,
                            target.z
                        );
                        break;

                    case 'top':
                        // Use +Y as screen-up to avoid a vector parallel
                        // to the viewing direction.
                        camera.up.set(0, 1, 0);
                        position.set(
                            target.x,
                            target.y,
                            target.z + distance
                        );
                        break;

                    case 'isometric':
                        camera.up.set(0, 0, 1);
                        position.set(
                            target.x + distance,
                            target.y + distance * 0.8,
                            target.z + distance
                        );
                        break;

                    default:
                        return;
                }

                camera.position.copy(position);
                camera.lookAt(target);
                camera.updateProjectionMatrix();

                controls.update();
                currentView = viewName;
                updateStatus();
            }

            function syncOrthographicFromPerspective() {
                var distance = perspectiveCamera.position.distanceTo(
                    controls.target
                );

                var fov = THREE.MathUtils.degToRad(
                    perspectiveCamera.fov
                );

                var visibleHeight = 2 * distance * Math.tan(fov / 2);
                var visibleWidth = visibleHeight * aspect;

                orthographicCamera.left = -visibleWidth / 2;
                orthographicCamera.right = visibleWidth / 2;
                orthographicCamera.top = visibleHeight / 2;
                orthographicCamera.bottom = -visibleHeight / 2;
                orthographicCamera.zoom = 1;
                orthographicCamera.updateProjectionMatrix();
            }

            function syncPerspectiveFromOrthographic() {
                var visibleHeight = (
                    orthographicCamera.top - orthographicCamera.bottom
                ) / orthographicCamera.zoom;

                var fov = THREE.MathUtils.degToRad(
                    perspectiveCamera.fov
                );

                var distance = visibleHeight / (
                    2 * Math.tan(fov / 2)
                );

                var direction = orthographicCamera.position
                    .clone()
                    .sub(controls.target)
                    .normalize();

                perspectiveCamera.position.copy(
                    controls.target.clone().add(
                        direction.multiplyScalar(distance)
                    )
                );
            }

            function setCameraType(type) {
                if (
                    type !== 'perspective' &&
                    type !== 'orthographic'
                ) {
                    return;
                }

                if (type === activeCameraType) {
                    return;
                }

                var previousCamera = camera;

                if (type === 'orthographic') {
                    syncOrthographicFromPerspective();
                    camera = orthographicCamera;
                    camera.position.copy(previousCamera.position);
                } else {
                    camera = perspectiveCamera;
                    syncPerspectiveFromOrthographic();
                }

                camera.quaternion.copy(previousCamera.quaternion);
                camera.up.copy(previousCamera.up);
                camera.updateProjectionMatrix();

                activeCameraType = type;
                controls.object = camera;
                controls.update();

                document.getElementById(
                    'cam-type-__UNIQUE_ID__'
                ).value = type;

                updateStatus();
            }

            function resetView() {
                controls.target.copy(getDefaultTarget());
                setView('isometric', false);
            }

            function updateStatus() {
                var cameraName = activeCameraType === 'orthographic'
                    ? 'Orthographic'
                    : 'Perspective';

                var viewName = currentView === 'custom'
                    ? 'Custom'
                    : currentView.charAt(0).toUpperCase() + currentView.slice(1);

                var status = document.getElementById(
                    'status-__UNIQUE_ID__'
                );

                status.innerHTML =
                    cameraName + ' | ' + viewName +
                    ' &mdash; Middle drag to orbit | ' +
                    'Left/Right drag to pan | Wheel to zoom';

                status.style.color = 'green';
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            window.robot___UNIQUE_ID__ = {
                resetView: resetView,
                setView: setView,
                setCameraType: setCameraType
            };
        }
    })();
    </script>
</body>
</html>
