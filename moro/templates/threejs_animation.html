<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; overflow: hidden; background-color: #f5f5f5; }

        #controls-__UNIQUE_ID__ {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            min-width: 220px;
        }

        #controls-__UNIQUE_ID__ .control-row {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        #controls-__UNIQUE_ID__ button,
        #controls-__UNIQUE_ID__ select {
            margin: 0;
            padding: 5px 9px;
            cursor: pointer;
            border: none;
            color: white;
            background: #4CAF50;
            border-radius: 3px;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        #controls-__UNIQUE_ID__ button:hover,
        #controls-__UNIQUE_ID__ select:hover {
            background: #449d48;
        }

        #play-button-__UNIQUE_ID__ {
            background: #2196F3 !important;
        }

        #play-button-__UNIQUE_ID__:hover {
            background: #1976D2 !important;
        }

        #controls-__UNIQUE_ID__ .frame-control {
            margin-top: 6px;
        }

        #controls-__UNIQUE_ID__ input[type=range] {
            width: 100%;
        }

        #status-__UNIQUE_ID__ {
            margin-top: 5px;
            padding: 5px;
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="controls-__UNIQUE_ID__">
        <div class="control-row">
            <button onclick="window.robot___UNIQUE_ID__.setView('front')">
                Front
            </button>
            <button onclick="window.robot___UNIQUE_ID__.setView('top')">
                Top
            </button>
            <button onclick="window.robot___UNIQUE_ID__.setView('isometric')">
                Isometric
            </button>
        </div>

        <div class="control-row">
            <select id="cam-type-__UNIQUE_ID__"
                    onchange="window.robot___UNIQUE_ID__.setCameraType(this.value)">
                <option value="perspective">Perspective</option>
                <option value="orthographic" selected>Orthographic</option>
            </select>

            <button id="play-button-__UNIQUE_ID__"
                    onclick="window.robot___UNIQUE_ID__.togglePlay()">
                &#9654; Play
            </button>

            <button onclick="window.robot___UNIQUE_ID__.resetView()">
                &#x21bb; Reset
            </button>
        </div>

        <div class="frame-control">
            <label>
                Frame:
                <span id="frameLabel-__UNIQUE_ID__">0</span> / __LAST_FRAME__
            </label>
            <input type="range"
                   id="slider-__UNIQUE_ID__"
                   min="0"
                   max="__LAST_FRAME__"
                   value="0"
                   step="1"
                   oninput="window.robot___UNIQUE_ID__.goToFrame(parseInt(this.value, 10))">
        </div>

        <div id="status-__UNIQUE_ID__">Loading...</div>
    </div>

    <div id="container-__UNIQUE_ID__"></div>

    <script>
    (function() {
        if (typeof THREE !== 'undefined' &&
                typeof THREE.OrbitControls !== 'undefined') {
            initRobot___UNIQUE_ID__();
        } else {
            var scripts = [
                'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
                'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'
            ];
            var loaded = 0;

            scripts.forEach(function(src) {
                var script = document.createElement('script');
                script.src = src;
                script.onload = function() {
                    loaded++;
                    if (loaded === scripts.length) {
                        initRobot___UNIQUE_ID__();
                    }
                };
                script.onerror = function() {
                    var status = document.getElementById('status-__UNIQUE_ID__');
                    status.innerHTML = 'Error loading Three.js';
                    status.style.color = 'red';
                };
                document.head.appendChild(script);
            });
        }

        function initRobot___UNIQUE_ID__() {
            var framesData = __FRAMES_DATA__;
            var container = document.getElementById('container-__UNIQUE_ID__');
            var slider = document.getElementById('slider-__UNIQUE_ID__');
            var frameLabel = document.getElementById('frameLabel-__UNIQUE_ID__');
            var playButton = document.getElementById('play-button-__UNIQUE_ID__');
            var cameraSelect = document.getElementById('cam-type-__UNIQUE_ID__');
            var status = document.getElementById('status-__UNIQUE_ID__');

            var scene;
            var camera;
            var perspectiveCamera;
            var orthographicCamera;
            var renderer;
            var controls;
            var robotGroup;

            var currentFrame = 0;
            var isPlaying = false;
            var playInterval = null;
            var activeCameraType = 'orthographic';
            var currentView = 'isometric';

            // Compute one global bounding box for the complete animation.
            // The resulting scale remains fixed while frames are played, so links,
            // joints and coordinate axes do not change size between frames.
            var animationBounds = computeAnimationBounds(framesData);
            var sceneCenter = animationBounds.center;
            var dim = animationBounds.dimension * 1.15;

            function computeAnimationBounds(animationData) {
                var minPoint = new THREE.Vector3(
                    Infinity,
                    Infinity,
                    Infinity
                );
                var maxPoint = new THREE.Vector3(
                    -Infinity,
                    -Infinity,
                    -Infinity
                );
                var largestDeclaredDimension = 0;
                var pointCount = 0;

                function expandBounds(position) {
                    if (!Array.isArray(position) || position.length < 3) {
                        return;
                    }

                    var x = Number(position[0]);
                    var y = Number(position[1]);
                    var z = Number(position[2]);

                    if (
                        !Number.isFinite(x) ||
                        !Number.isFinite(y) ||
                        !Number.isFinite(z)
                    ) {
                        return;
                    }

                    var point = new THREE.Vector3(x, y, z);
                    minPoint.min(point);
                    maxPoint.max(point);
                    pointCount++;
                }

                animationData.forEach(function(frameData) {
                    var declaredDimension = Number(frameData.dimension);
                    if (
                        Number.isFinite(declaredDimension) &&
                        declaredDimension > 0
                    ) {
                        largestDeclaredDimension = Math.max(
                            largestDeclaredDimension,
                            declaredDimension
                        );
                    }

                    if (Array.isArray(frameData.joints)) {
                        frameData.joints.forEach(expandBounds);
                    }

                    if (Array.isArray(frameData.frames)) {
                        frameData.frames.forEach(function(frame) {
                            expandBounds(frame.position);
                        });
                    }
                });

                if (pointCount === 0) {
                    var fallbackDimension = Math.max(
                        largestDeclaredDimension,
                        1
                    );
                    return {
                        min: new THREE.Vector3(
                            -fallbackDimension / 2,
                            -fallbackDimension / 2,
                            -fallbackDimension / 2
                        ),
                        max: new THREE.Vector3(
                            fallbackDimension / 2,
                            fallbackDimension / 2,
                            fallbackDimension / 2
                        ),
                        center: new THREE.Vector3(0, 0, 0),
                        size: new THREE.Vector3(
                            fallbackDimension,
                            fallbackDimension,
                            fallbackDimension
                        ),
                        dimension: fallbackDimension
                    };
                }

                var size = new THREE.Vector3().subVectors(
                    maxPoint,
                    minPoint
                );
                var center = new THREE.Vector3()
                    .addVectors(minPoint, maxPoint)
                    .multiplyScalar(0.5);
                var measuredDimension = Math.max(
                    size.x,
                    size.y,
                    size.z
                );

                return {
                    min: minPoint,
                    max: maxPoint,
                    center: center,
                    size: size,
                    dimension: Math.max(
                        measuredDimension,
                        largestDeclaredDimension,
                        1
                    )
                };
            }

            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xf5f5f5);

                var width = __WIDTH__;
                var height = __HEIGHT__;
                var aspect = width / height;
                var nearPlane = Math.max(dim * 0.001, 0.01);
                var farPlane = Math.max(dim * 50, 1000);

                perspectiveCamera = new THREE.PerspectiveCamera(
                    50,
                    aspect,
                    nearPlane,
                    farPlane
                );

                var orthoHeight = dim * 3.0;
                var orthoWidth = orthoHeight * aspect;

                orthographicCamera = new THREE.OrthographicCamera(
                    -orthoWidth / 2,
                    orthoWidth / 2,
                    orthoHeight / 2,
                    -orthoHeight / 2,
                    -farPlane,
                    farPlane
                );

                // Robotics convention: Z is the vertical axis.
                perspectiveCamera.up.set(0, 0, 1);
                orthographicCamera.up.set(0, 0, 1);

                camera = orthographicCamera;

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                // OrbitControls with CAD-like mouse mapping.
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.target.copy(sceneCenter);
                controls.enableDamping = true;
                controls.dampingFactor = 0.1;
                controls.mouseButtons = {
                    LEFT: THREE.MOUSE.PAN,
                    MIDDLE: THREE.MOUSE.ROTATE,
                    RIGHT: THREE.MOUSE.PAN
                };
                controls.touches = {
                    ONE: THREE.TOUCH.PAN,
                    TWO: THREE.TOUCH.DOLLY_PAN
                };

                setView('isometric');

                // Lights.
                scene.add(new THREE.AmbientLight(0xffffff, 0.6));

                var dl1 = new THREE.DirectionalLight(0xffffff, 0.5);
                dl1.position.set(dim, dim, dim);
                scene.add(dl1);

                var dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
                dl2.position.set(-dim, -dim, -dim);
                scene.add(dl2);

                // Grid on the global XY plane (Z = 0). Its center must remain
                // at the world origin so that it agrees with the robot base frame.
                // The size is made symmetric about the origin and large enough to
                // contain the complete animation, even when its bounds are offset.
                var gridHalfExtent = Math.max(
                    Math.abs(animationBounds.min.x),
                    Math.abs(animationBounds.max.x),
                    Math.abs(animationBounds.min.y),
                    Math.abs(animationBounds.max.y),
                    dim / 2
                );
                var gridSize = Math.max(gridHalfExtent * 2.4, dim * 2.5);
                var gridDivisions = 20;
                var grid = new THREE.GridHelper(
                    gridSize,
                    gridDivisions,
                    0x888888,
                    0xcccccc
                );
                grid.rotation.x = Math.PI / 2;
                grid.position.set(0, 0, 0);
                scene.add(grid);

                // Global coordinate system at the world origin.
                var worldAxes = new THREE.AxesHelper(dim / 4);
                worldAxes.position.set(0, 0, 0);
                scene.add(worldAxes);

                robotGroup = new THREE.Group();
                scene.add(robotGroup);

                drawRobot(framesData[0]);
                animate();

                status.innerHTML =
                    'Ready &mdash; ' + framesData.length +
                    ' frames | Middle drag to orbit | Left/Right drag to pan | Wheel to zoom';
                status.style.color = 'green';
            } catch (error) {
                status.innerHTML = 'Error: ' + error.message;
                status.style.color = 'red';
            }

            function clearRobotGroup() {
                while (robotGroup.children.length > 0) {
                    var child = robotGroup.children[0];
                    robotGroup.remove(child);

                    if (child.geometry) {
                        child.geometry.dispose();
                    }

                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(function(material) {
                                material.dispose();
                            });
                        } else {
                            child.material.dispose();
                        }
                    }
                }
            }

            function drawRobot(data) {
                clearRobotGroup();

                var joints = data.joints;
                var frames = data.frames;

                // Links.
                var linkMat = new THREE.MeshPhongMaterial({
                    color: 0x778877,
                    shininess: 30,
                    side: THREE.DoubleSide
                });

                for (var i = 0; i < joints.length - 1; i++) {
                    var start = new THREE.Vector3().fromArray(joints[i]);
                    var end = new THREE.Vector3().fromArray(joints[i + 1]);
                    var direction = new THREE.Vector3().subVectors(end, start);
                    var length = direction.length();

                    if (length < 1e-6) {
                        continue;
                    }

                    var radius = Math.max(dim * 0.015, 0.3);
                    var cylinder = new THREE.Mesh(
                        new THREE.CylinderGeometry(radius, radius, length, 8),
                        linkMat
                    );

                    var midpoint = start.clone().add(
                        direction.clone().multiplyScalar(0.5)
                    );
                    cylinder.position.copy(midpoint);
                    cylinder.quaternion.setFromUnitVectors(
                        new THREE.Vector3(0, 1, 0),
                        direction.clone().normalize()
                    );
                    robotGroup.add(cylinder);
                }

                // Joints.
                var jointMat = new THREE.MeshPhongMaterial({
                    color: 0xff1493,
                    shininess: 50
                });
                var baseMat = new THREE.MeshPhongMaterial({
                    color: 0xff00ff,
                    shininess: 50
                });

                joints.forEach(function(position, index) {
                    var radius = index === 0
                        ? Math.max(dim * 0.03, 0.6)
                        : Math.max(dim * 0.02, 0.4);
                    var material = index === 0 ? baseMat : jointMat;
                    var sphere = new THREE.Mesh(
                        new THREE.SphereGeometry(radius, 16, 16),
                        material
                    );
                    sphere.position.fromArray(position);
                    robotGroup.add(sphere);
                });

                // Coordinate frames.
                // The payload stores the local frame axes expressed in the
                // world frame. THREE.Matrix4.makeBasis expects those vectors
                // as the columns of the rotation matrix, matching FrameData.x,
                // FrameData.y and FrameData.z.
                var axesLength = Math.max(dim / 6, 1.0);
                frames.forEach(function(frame) {
                    var xAxis = new THREE.Vector3().fromArray(frame.x).normalize();
                    var yAxis = new THREE.Vector3().fromArray(frame.y).normalize();
                    var zAxis = new THREE.Vector3().fromArray(frame.z).normalize();

                    var rotationMatrix = new THREE.Matrix4();
                    rotationMatrix.makeBasis(xAxis, yAxis, zAxis);

                    var axes = new THREE.AxesHelper(axesLength);
                    axes.position.fromArray(frame.position);
                    axes.quaternion.setFromRotationMatrix(rotationMatrix);
                    robotGroup.add(axes);
                });
            }

            function goToFrame(index) {
                if (!Number.isFinite(index)) {
                    return;
                }

                index = Math.max(0, Math.min(index, framesData.length - 1));
                currentFrame = index;
                drawRobot(framesData[index]);
                slider.value = index;
                frameLabel.textContent = index;
            }

            function updatePlayButton() {
                playButton.innerHTML = isPlaying
                    ? '&#10074;&#10074; Pause'
                    : '&#9654; Play';
                playButton.setAttribute('aria-pressed', String(isPlaying));
            }

            function startPlayback() {
                if (playInterval !== null) {
                    return;
                }

                isPlaying = true;
                updatePlayButton();

                playInterval = window.setInterval(function() {
                    var nextFrame = (currentFrame + 1) % framesData.length;
                    goToFrame(nextFrame);
                }, 100);
            }

            function pausePlayback() {
                isPlaying = false;
                updatePlayButton();

                if (playInterval !== null) {
                    window.clearInterval(playInterval);
                    playInterval = null;
                }
            }

            function togglePlay() {
                if (isPlaying) {
                    pausePlayback();
                } else {
                    startPlayback();
                }
            }

            function setView(viewName) {
                var distance = dim * 2.5;
                var target = controls.target;
                var offset = new THREE.Vector3();

                switch (viewName) {
                    case 'front':
                        offset.set(0, -distance, 0);
                        break;
                    case 'top':
                        offset.set(0, 0, distance);
                        break;
                    case 'isometric':
                        offset.set(distance, distance * 0.8, distance);
                        break;
                    default:
                        return;
                }

                camera.position.copy(target).add(offset);
                camera.lookAt(target);
                controls.update();
                currentView = viewName;
            }

            function setCameraType(type) {
                if (type !== 'perspective' && type !== 'orthographic') {
                    return;
                }

                if (type === activeCameraType) {
                    cameraSelect.value = type;
                    return;
                }

                var newCamera = type === 'perspective'
                    ? perspectiveCamera
                    : orthographicCamera;

                newCamera.position.copy(camera.position);
                newCamera.quaternion.copy(camera.quaternion);
                newCamera.up.copy(camera.up);

                camera = newCamera;
                activeCameraType = type;
                controls.object = camera;
                controls.update();
                cameraSelect.value = type;
            }

            function resetView() {
                controls.target.copy(sceneCenter);

                if (activeCameraType !== 'orthographic') {
                    setCameraType('orthographic');
                }

                orthographicCamera.zoom = 1;
                orthographicCamera.updateProjectionMatrix();
                perspectiveCamera.zoom = 1;
                perspectiveCamera.updateProjectionMatrix();

                setView('isometric');
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            window.robot___UNIQUE_ID__ = {
                togglePlay: togglePlay,
                goToFrame: goToFrame,
                setView: setView,
                setCameraType: setCameraType,
                resetView: resetView
            };
        }
    })();
    </script>
</body>
</html>
